services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////var/lib/signal/signal.sqlite3
      SIGNAL_SEED_DEMO: ${SIGNAL_SEED_DEMO:-0}
    volumes:
      - signaldata:/var/lib/signal
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        SIGNAL_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  signaldata:

version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: signal_db
    environment:
      POSTGRES_DB: signal_db
      POSTGRES_USER: signal_user
      POSTGRES_PASSWORD: signal_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signal_backend
    environment:
      - DATABASE_URL=postgresql://signal_user:signal_password@postgres:5432/signal_db
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signal_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
